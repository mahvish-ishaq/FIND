services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: host
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    network_mode: host
    environment:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/findtracker
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    network_mode: host
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data: