
apiVersion: apps/v1
kind: Deployment
metadata:
  name: find-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: find-app
  template:
    metadata:
      labels:
        app: find-app
    spec:
      containers:
        - name: find-app
          image: find-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/findtracker"

